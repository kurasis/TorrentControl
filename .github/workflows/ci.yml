name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match "builtin-baseline" in vcpkg.json.
  VCPKG_COMMIT: 3cbc1db4d867ec83c89fba4c461321c11f78b5e3
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_DISABLE_METRICS: 1

jobs:
  windows:
    name: Windows x64 (MSVC 14.44)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Check vcpkg pin
        shell: bash
        run: |
          grep -q "\"builtin-baseline\": \"$VCPKG_COMMIT\"" vcpkg.json

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          # Rotate the older partial cache so the completed native toolchain
          # (including libtorrent) is saved once instead of rebuilt each run.
          key: vcpkg-windows-x64-static-md-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-native-flow-v1
          restore-keys: vcpkg-windows-x64-static-md-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: |
          if not exist .vcpkg-cache mkdir .vcpkg-cache
          .vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Set up MSVC (pinned toolset 14.44)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.44"

      # The developer environment points VCPKG_ROOT at the vcpkg bundled with
      # Visual Studio; restore the pinned checkout.
      - name: Use pinned vcpkg
        shell: bash
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.vcpkg" >> "$GITHUB_ENV"

      - name: Install Ninja
        run: python -m pip install ninja==1.11.1.1

      - name: Configure
        run: cmake --preset windows-x64-release -DTC_REQUIRE_PINNED_TOOLCHAIN=ON

      # Saved right after dependencies are built, so a later build or test
      # failure does not throw away the (slow) dependency build.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset windows-x64-release

      - name: Test (unit + headless integration proof)
        run: ctest --preset windows-x64-release

      - name: Local payload cancellation and output preservation
        run: python tests/performance/payload_cancellation.py --proof build/windows-x64-release/tools/tc-proof/tc-proof.exe --report build/performance/windows-payload-cancellation.json

      - name: Creation memory and payload IO (real files)
        run: python tests/performance/creation_memory.py --proof build/windows-x64-release/tools/tc-proof/tc-proof.exe --report build/performance/windows-creation-memory.json

      - name: Native bridge benchmark (100000 real files)
        run: python tests/performance/native_bridge.py --proof build/windows-x64-release/tools/tc-proof/tc-native-proof.exe --report build/performance/windows-native.json --fixture-root build/performance/fixture

      - name: Upload native benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-performance
          path: build/performance/*.json
          if-no-files-found: warn

      - name: Windows dialogs, WebView2 workflow and renderer recovery
        shell: pwsh
        run: ./tests/windows/run-native-flow.ps1 -PerformanceRoot build/performance/fixture

      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-evidence
          path: |
            build/windows-native-evidence/*.log
            build/windows-native-evidence/*.json
            build/windows-native-evidence/data-*/output/
            build/windows-native-evidence/data-*/payload/
            build/windows-native-evidence/data-*/settings.json
          if-no-files-found: warn

      - name: Upload unsigned development build
        uses: actions/upload-artifact@v4
        with:
          name: TorrentControl-dev-unsigned-windows-x64
          path: |
            build/windows-x64-release/src/app/windows/TorrentControl.exe
            build/windows-x64-release/src/app/windows/TorrentControl.pdb
            build/windows-x64-release/src/app/windows/frontend/
            build/windows-x64-release/tools/tc-proof/tc-proof.exe
          if-no-files-found: error

  linux:
    name: Linux x64 (headless core, GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-x64-linux-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-linux-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        run: |
          mkdir -p .vcpkg-cache
          .vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset linux-release

      # Saved right after dependencies are built, so a later build or test
      # failure does not throw away the (slow) dependency build.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset linux-release

      - name: Test (unit + headless integration proof)
        run: ctest --preset linux-release

      - name: Local payload cancellation and output preservation
        run: python3 tests/performance/payload_cancellation.py --proof build/linux-release/tools/tc-proof/tc-proof --report build/performance/linux-payload-cancellation.json

      - name: Creation memory and payload IO (real files)
        run: python3 tests/performance/creation_memory.py --proof build/linux-release/tools/tc-proof/tc-proof --report build/performance/linux-creation-memory.json

      - name: Native bridge benchmark (100000 real files)
        run: python3 tests/performance/native_bridge.py --proof build/linux-release/tools/tc-proof/tc-native-proof --report build/performance/linux-native.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: tools/anacrolix-proof/go.sum

      - name: Build independent client audit tool
        working-directory: tools/anacrolix-proof
        env:
          CGO_ENABLED: '0'
          GOMAXPROCS: '4'
        run: go build -p 4 -buildvcs=false -mod=readonly -o ../../build/anacrolix-proof .

      - name: Independent client audit (open gates reported)
        run: python3 tests/integration/client_compatibility.py --proof build/linux-release/tools/tc-proof/tc-proof --client build/anacrolix-proof --report build/performance/client-compatibility.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch checksum-pinned BiglyBT developer dependency
        run: python3 tools/biglybt-proof/fetch.py build/biglybt/BiglyBT.jar

      - name: Independent v1 and v2 hash audit (BiglyBT)
        run: python3 tests/integration/biglybt_compatibility.py --proof build/linux-release/tools/tc-proof/tc-proof --jar build/biglybt/BiglyBT.jar --report build/performance/biglybt-hash-audit.json

      - name: Install Clang 18 and sanitizer runtimes
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 libclang-rt-18-dev

      - name: Configure instrumented project code with prebuilt dependencies
        env:
          CXX: clang++-18
          TC_DEPS_PREFIX: ${{ github.workspace }}/build/linux-release/vcpkg_installed/x64-linux
        run: cmake --preset linux-fuzz

      - name: Build sanitizer tests and libFuzzer targets
        run: cmake --build --preset linux-fuzz --parallel 4

      - name: Native tests under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p build/fuzz-evidence
          ctest --preset linux-fuzz --parallel 4 --output-junit "$GITHUB_WORKSPACE/build/fuzz-evidence/ctest.xml"

      - name: Fuzz smoke campaigns (runs=3)
        run: |
          python3 tests/fuzz/seed_corpus.py --proof build/linux-fuzz/tools/tc-proof/tc-proof --output build/fuzz-seeds
          python3 tests/fuzz/run_campaign.py --build build/linux-fuzz --corpus build/fuzz-seeds --output build/fuzz-evidence/campaign --runs 3

      - name: Upload sanitizer and fuzz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-fuzz-sanitizer-evidence
          path: |
            build/fuzz-evidence/
            build/linux-fuzz/Testing/Temporary/
          if-no-files-found: warn

      - name: Upload performance and client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-performance-compatibility
          path: build/performance/*.json
          if-no-files-found: warn

  ui:
    name: UI (Chromium, mocked bridge)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npx playwright test
        env:
          CI: "1"
